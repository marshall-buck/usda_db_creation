include: package:very_good_analysis/analysis_options.yaml


analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**


linter:
  rules:
    # The formatter is configured for 120 columns below; this rule would
    # contradict it on every wrapped line.
    lines_longer_than_80_chars: false

formatter:
  page_width: 120